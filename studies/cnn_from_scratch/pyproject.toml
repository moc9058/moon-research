[project]
name = "moon-research-cnn-from-scratch"
version = "0.1.0"
description = "Independent CNN implementation and experiment"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "torchvision>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
